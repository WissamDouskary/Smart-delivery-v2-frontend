<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Register</h2>

    <form (ngSubmit)="register()" #RegisterForm="ngForm" class="space-y-4">
      <div class="flex gap-4">
        <div>
          <label class="block text-gray-700 mb-1" for="nom">Nom</label>
          <input
            type="text"
            id="nom"
            name="nom"
            [(ngModel)]="Nom"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            #nomCtrl="ngModel"
          />

          <p class="mt-2 font-bold text-red-400" *ngIf="nomCtrl.invalid && nomCtrl.touched">
            Nom required
          </p>
        </div>

        <div>
          <label class="block text-gray-700 mb-1" for="Prenom">Prenom</label>
          <input
            type="text"
            id="prenom"
            name="prenom"
            [(ngModel)]="Prenom"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            #prenomCtrl="ngModel"
          />

          <p class="mt-2 font-bold text-red-400" *ngIf="prenomCtrl.invalid && prenomCtrl.touched">
            Prenom required
          </p>
        </div>
      </div>

      <div>
        <label class="block text-gray-700 mb-1" for="telephone">Telephone</label>
        <input
          type="number"
          id="telephone"
          name="telephone"
          [(ngModel)]="Telephone"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          #telephoneCtrl="ngModel"
        />

        <p class="mt-2 font-bold text-red-400" *ngIf="telephoneCtrl.invalid && telephoneCtrl.touched">
          Telephone required
        </p>
      </div>

      <div>
        <label class="block text-gray-700 mb-1" for="adress">Adress</label>
        <input
          type="text"
          id="adress"
          name="adress"
          [(ngModel)]="Adress"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          #adressCtrl="ngModel"
        />

        <p class="mt-2 font-bold text-red-400" *ngIf="adressCtrl.invalid && adressCtrl.touched">
          Adress required
        </p>
      </div>

      <div>
        <label class="block text-gray-700 mb-1" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="Email"
          required
          email
          placeholder="you@example.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          #emailCtrl="ngModel"
        />

        <p class="mt-2 font-bold text-red-400" *ngIf="emailCtrl.invalid && emailCtrl.touched">
          Email required
        </p>
      </div>

      <div>
        <label class="block text-gray-700 mb-1" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="Password"
          required
          placeholder="********"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          #passwordCtrl="ngModel"
        />

        <p class="mt-2 font-bold text-red-400" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
          Password required
        </p>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed disabled:hover:bg-gray-400"
        [disabled]="RegisterForm.invalid"
      >
      @if (!Loading) {
        Create Account
      } @else {
        Creating account ...
      }
      </button>
    </form>
  </div>
</div>
