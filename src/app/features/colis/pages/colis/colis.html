<div class="min-h-screen bg-slate-50 p-6 md:p-10">
  <!-- Header Section -->
  <div class="mb-10 flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Mes Colis</h1>
      <p class="text-slate-500 mt-1">Gérez et suivez vos expéditions en temps réel.</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative group">
        <span
          class="absolute inset-y-0 left-3 flex items-center text-slate-400 group-focus-within:text-blue-500 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
        <input
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
          type="text"
          placeholder="Rechercher un colis..."
          class="pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm"
        />
      </div>
      @if (isAdminOrSender()) {
        <button
          routerLink="../colis/create"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-blue-500/20 active:scale-95 flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          Nouveau Colis
        </button>
      }
      </div>
  </div>

  <!-- Cards Grid -->
   @if (filteredColis().length > 0) {
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    
        @for (item of filteredColis(); track item.id) {
          <app-card [colis]="item"></app-card>
        }

  </div>
  } @else {
    <div class="flex flex-col items-center justify-center py-20 text-slate-400">
      <p class="text-xl font-medium">Aucun colis trouvé</p>
      <p>Essayez d'ajuster vos critères de recherche.</p>
    </div>
  }
</div>
